<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><pattern id="cork" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#B98A57"/><circle cx="6" cy="8" r="2" fill="#A47645"/><circle cx="17" cy="16" r="2.5" fill="#C99A66"/></pattern></defs><g id="cork_board"><rect width="1920" height="1080" fill="url(#cork)"/></g><g id="clippings"><g id="clipping_1"><g transform="rotate(-4 310 250)"><rect x="120" y="120" width="380" height="260" fill="#F2EDE0"/><text x="310" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle">RustyKettle ROBBED</text><rect x="150" y="212" width="320" height="4" fill="#1A1A1A"/><text x="310" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#333333" text-anchor="middle">Down 2 overnight</text><rect x="150" y="288" width="320" height="8" fill="#C9C2AE"/><rect x="150" y="310" width="270" height="8" fill="#C9C2AE"/><rect x="150" y="332" width="220" height="8" fill="#C9C2AE"/></g></g><g id="clipping_2"><g transform="rotate(3 830 220)"><rect x="640" y="90" width="380" height="260" fill="#F2EDE0"/><text x="830" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle">QuietBadger STRIKES</text><rect x="670" y="182" width="320" height="4" fill="#1A1A1A"/><text x="830" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#333333" text-anchor="middle">Caught a thief red-handed</text><rect x="670" y="258" width="320" height="8" fill="#C9C2AE"/><rect x="670" y="280" width="270" height="8" fill="#C9C2AE"/><rect x="670" y="302" width="220" height="8" fill="#C9C2AE"/></g></g><g id="clipping_3"><g transform="rotate(-2 1390 270)"><rect x="1200" y="140" width="380" height="260" fill="#F2EDE0"/><text x="1390" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle">WHERE WAS SOGGYBISCUIT?</text><rect x="1230" y="232" width="320" height="4" fill="#1A1A1A"/><text x="1390" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#333333" text-anchor="middle">Out late again</text><rect x="1230" y="308" width="320" height="8" fill="#C9C2AE"/><rect x="1230" y="330" width="270" height="8" fill="#C9C2AE"/><rect x="1230" y="352" width="220" height="8" fill="#C9C2AE"/></g></g><g id="clipping_4"><g transform="rotate(2 450 690)"><rect x="260" y="560" width="380" height="260" fill="#F2EDE0"/><text x="450" y="630" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle">LuckyLantern STARVES</text><rect x="290" y="652" width="320" height="4" fill="#1A1A1A"/><text x="450" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#333333" text-anchor="middle">Ran out of food</text><rect x="290" y="728" width="320" height="8" fill="#C9C2AE"/><rect x="290" y="750" width="270" height="8" fill="#C9C2AE"/><rect x="290" y="772" width="220" height="8" fill="#C9C2AE"/></g></g><g id="clipping_5"><g transform="rotate(-3 1010 650)"><rect x="820" y="520" width="380" height="260" fill="#F2EDE0"/><text x="1010" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle">WHO DID IT?</text><rect x="850" y="612" width="320" height="4" fill="#1A1A1A"/><text x="1010" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#333333" text-anchor="middle">Every theft revealed</text><rect x="850" y="688" width="320" height="8" fill="#C9C2AE"/><rect x="850" y="710" width="270" height="8" fill="#C9C2AE"/><rect x="850" y="732" width="220" height="8" fill="#C9C2AE"/></g></g><g id="clipping_6"><g transform="rotate(4 1530 690)"><rect x="1340" y="560" width="380" height=